<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <link rel="stylesheet" href="./snakegame.css">
</head>
<body>
    <div class="header">
        <h1>ЗМЕЙКА</h1>
    </div>
        
    <button class="settings" data-modal="modal">
        <img src="./pngwing.com.png" alt="settings">
    </button>


    <div class="modal" id = "modal">
        <div class="modal-content">
          <h2>НАСТРОЙКИ</h2>
          <button class="sound glitch-btn" data-sound="sound"><img src="./pngwing.com(2).png" alt="звук" id = "sound"></button>
          <button data-close = "modal" class="close-btn">Закрыть</button>
        </div>
    </div>

    <div class="body">
        <div class="controls">
            <div class="mode-selector">
                <h2>УРОВНИ</h2>
                <div class="mode-buttons">
                    <button class="level active" data-level="0"><p>1 УРОВЕНЬ</p><p>простая змейка</p></button>
                    <button class="level" data-level="100"><p>2 УРОВЕНЬ</p><p>повышение скорости</p></button>
                    <button class="level" data-level="1"><p>3 УРОВЕНЬ</p><p>1 преграда</p></button>
                    <button class="level" data-level="5"><p>4 УРОВЕНЬ</p><p>5 преград</p></button>
                    <button class="level" data-level="50"><p>5 УРОВЕНЬ</p><p>экстримальное повышение скорости</p></button>
                </div>
            </div>
        </div>
            <div class="game-container">
                <div class="game-header">
                    <div class="score-container">
                        <div class="score-title">ОЧКИ</div>
                        <div class="score">0</div>
                    </div>
                </div>
            <canvas id="gameCanvas" class="game-board"></canvas>
        </div>
                    
        <div class="controls">
            <div class="mode-selector">
                <h2>РЕЖИМЫ</h2>
                <div class="mode-buttons">
                    <button id="modeSmall" class="mode-btn 2000 100" data-mode="modeSmall">Маленькое поле (10x10, 1 яблоко)</button>
                    <button id="modeMedium" class="mode-btn 8000 200 active" data-mode="modeMedium">Среднее поле (20x20, 2 яблока)</button>
                    <button id="modeLarge" class="mode-btn 18000 300" data-mode="modeLarge">Большое поле (30x30, 3 яблок)</button>
                </div>
            </div>
                <div class="buttons">
                    <button class="start-btn" data-start="startBtn">НАЧАТЬ ИГРУ</button>
                </div>
            </div>
        </div>
    <div id="gameOver" class="game-over">
        <h2>ИГРА ОКОНЧЕНА</h2>   
        <p class="finalScoreOver">Ваш счет: 0</p>
        <button class="restart-btn" data-over="over" >ИГРАТЬ СНОВА</button>
    </div>
    <div id="gameWin" class="game-win">
        <h2>ВЫ ПОБЕДИЛИ</h2>   
        <p class="finalScoreWin">Ваш счет: 0</p>
        <button class="restart-btn" data-over="over" >ИГРАТЬ СНОВА</button>
    </div>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="./snakegame.js"></script>
    </body>
</html>
